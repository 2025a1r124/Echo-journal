{% extends "base.html" %}
{% block title %}Sign in - Echo Journal{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}

  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32">

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">

  <p class="actions"><button type="submit">Sign in</button></p>
</form>
<p class="hint">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
{% endblock %}
